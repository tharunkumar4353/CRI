<div class="card">  
    <div class="grid p-fluid mt-1">
        <div class="field col-12 md:col-11">
            <h4>Employee Search</h4>
        </div> 
        <div class="field col-12 md:col-1 text-right"> 
            <p-button class="refresh-button" (click)="goBack()"><i class="fa-solid fa-arrow-left"></i></p-button>

        </div>
    </div> 
       
    <hr>
    <div class="grid p-fluid mt-1">
        <div class="field col-12 md:col-4">
            <span class="p-float-label">
                <input pInputText id="empid" [(ngModel)]="filterEmployeeId" />
                <label for="empid">Employee Id</label>
            </span>
        </div>
        <div class="field col-12 md:col-4">
            <span class="p-float-label">
                <input pInputText id="empname" [(ngModel)]="filterEmployeeName" />
                <label for="empname">Employee Name</label>
            </span>
        </div>
    </div>    
    <div class="grid p-fluid mt-1">
        <div class="field col-12 md:col-2">
            <p-button label="Search" (click)="submitForm()"><i class="fa-solid fa-magnifying-glass"></i></p-button>
        </div>
    </div>  
</div>  

<div class="card">
    <h4>Employee Summary Table</h4>
    <hr>
    <div class="grid p-fluid mt-1">
        <div class="field col-12 md:col-2">
            <p-button label="Download Excel" (click)="exportExcel()"><i class="fa-solid fa-download"></i></p-button>
        </div>
        <div class="field col-12 md:col-2">
            <p-button label="Download PDF" (click)="exportPdf()"><i class="fa-solid fa-download"></i></p-button>
        </div>
        <div class="field col-12 md:col-8 text-right">
            <p-button class="refresh-button" (click)="refreshData()"><i class="fa-solid fa-arrows-rotate"></i></p-button>
        </div>
    </div>
    <div class="table-container">
        <div class="table-wrapper">
            <table class="table" id="summary-table">
                <thead>
                    <tr>
                        <th>Employee Id</th>
                        <th>Employee Name</th>
                        <th>Department</th>
                        <th>Mail Id</th>
                        <th>Phone Number</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let employee of filteredEmployeeData">
                        <td>{{ employee.emp_id }}</td>
                        <td>{{ employee.emp_name }}</td>
                        <td>{{ employee.department }}</td>
                        <td>{{ employee.mail_id }}</td>
                        <td>{{ employee.phone_no }}</td>    
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
    .refresh-button {
        float: right;
    }
    .button-container {
        display: flex; 
    }
    .icon-button {
        border: 1px solid rgba(0, 0, 0, 0.2); 
        cursor: pointer;
        padding: 3px 8px;
        margin-right: 10px;
        display: flex;
        align-items: center;
        font-size: 10px;
        border-radius: 9px;
        transition: background-color 0.3s ease, box-shadow 0.3s ease; 
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5); 
    }
    .icon-button:hover {
        background-color: rgba(0, 0, 0, 1);
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2); 
    }
    .edit-button {
        background-color: whitesmoke; 
        color: black; 
    }
    .delete-button {
        background-color: whitesmoke; 
        color: black; 
    }
    .icon-button:last-child {
        margin-right: 0;
    }
    .icon-button i {
        margin-right: 5px; 
        font-size: 14px; 
    }
    .icon-button:hover {
        filter: brightness(90%); 
    }
    .icon-button:hover {
        transform: scale(1.1); 
    }
    .edit-button:hover {
        background-color: rgb(23, 195, 252); 
    }   
    .delete-button:hover {
        background-color: rgb(245, 61, 61); 
    }

    /* app.component.css */
    .table-container {
        margin-top: 20px;
        position: relative;
    }
  
    .table-wrapper {
        max-height: 600px; /* Adjust this value as needed to show 10 rows */
        overflow-y: auto;
    }

    .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }
  
    .table th, .table td {
        border: 1px solid #ddd;
        padding: 15px;
        text-align: left;
    }
  
    .table th {
        background-color: #f2f2f2;
        position: sticky;
        top: 0;
        z-index: 1;
    }
  
    .table tbody tr:nth-child(even) {
        background-color: #f9f9f9;
    }
</style>
