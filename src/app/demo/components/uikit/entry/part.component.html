<div class="card">  
    <div class="grid p-fluid mt-1">
        <div class="field col-12 md:col-11">
            <h4>Part Search</h4> 
        </div> 
        <div class="field col-12 md:col-1 text-right"> 
            <p-button class="refresh-button" (click)="goBack()"><i class="fa-solid fa-arrow-left"></i></p-button>
        </div>
    </div> 
      
    <hr>
    <div class="grid p-fluid mt-1">
        <div class="field col-12 md:col-4">
            <span class="p-float-label">
                <input pInputText id="partid" [(ngModel)]="value3" />
                <label for="partid">Part Id</label>
            </span>
        </div>
        
          
        <div class="field col-12 md:col-4">
            <span class="p-float-label">
                <input pInputText id="partname" [(ngModel)]="value2" />
                <label for="partname">Part Name</label>
            </span>
        </div>
         
        
        
    </div> 
      
    <div class="grid p-fluid mt-1">
        <div class="field col-12 md:col-2">
            <p-button label="Search" (click)="submitForm()"><i class="fa-solid fa-magnifying-glass"></i></p-button>
        </div>
        

    </div>   
</div>  

    <div class="card custom">
<h4>Process Mapping Summary Table</h4>
<hr>
        <div class="grid p-fluid mt-1">

            <div class="field col-12 md:col-2">
              <p-button label="Download Excel" (click)="exportExcel()"><i class="fa-solid fa-download"></i></p-button>
            </div>
            <div class="field col-12 md:col-2">
              <p-button label="Download PDF" (click)="exportPdf()"><i class="fa-solid fa-download"></i></p-button>
            </div>
            <div class="field col-12 md:col-8 text-right">
                <p-button class="refresh-button" (onClick)="refreshData()"><i class="fa-solid fa-arrows-rotate"></i></p-button>
            </div>
          </div>
    
        <!-- Table structure for summary -->
        <table class="table" #summaryTable>
            <thead>
                <tr>
                    <th>Work Order</th>
                    <th>Customer Code</th>
                    <th>FG Name</th>
                    <th>Part Id</th>
                    <th>Part Name</th>
                    <th>Order Qty</th>

                    

                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let process of sum">
                    <td>{{ process.work_order }}</td>
                    <td>{{ process.cust_code }}</td>
                    <td>{{ process.fg_name }}</td>
                    <td>{{ process.part_id }}</td>
                    <td>{{ process.part_name }}</td>
                    <td>{{ process.order_qty }}</td>


                </tr>
            </tbody>
        </table>
        </div>
    <style>

            width: 10px;
        }

            }

                font-size: 10px;

                transition: background-color 0.3s ease, box-shadow 0.3s ease; 
                box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.7); 
            }
            .icon-button:hover {
                background-color: rgba(0, 0, 0, 1);
                box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2); 
            }
            .edit-button {
                background-color: whitesmoke; 
                color: black; 
            }
            .delete-button {
                background-color: whitesmoke; 
                color: black; 
            }
            .icon-button:last-child {
                margin-right: 0;
            }
            .icon-button i {
                margin-right: 5px; 
                font-size: 14px; 
            }

                filter: brightness(90%); 
            }
            .icon-button:hover {

            }

            }   
            .delete-button:hover {
                background-color: rgb(245, 61, 61); 
            }
