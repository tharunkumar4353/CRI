<div class="card">
    <div class="grid p-fluid mt-1">
        <div class="field col-12 md:col-11">
            <h4>VMC 001</h4>
        </div>
        <div class="field col-12 md:col-1 text-right">
            <p-button class="refresh-button" (click)="goBack()"><i class="fa-solid fa-arrow-left"></i></p-button>
        </div>
    </div>
    <hr>
    <div class="grid">
        <div class="col-12 md:col-2">
            <div class="card p-fluid" >
                    <label>Date : {{ Date | date:'dd/MM/yyyy' }}</label>
            </div>    
        </div>
        <div class="col-12 md:col-2">
            <div class="card p-fluid">
                <label>Plan Number : {{ customid }}</label>
            </div>
        </div>
        <div class="col-12 md:col-3">
            <div class="card p-fluid">
                <label>Process Type: {{processType}}</label>

            </div>
        </div>
        <div class="col-12 md:col-2">
            <div class=" p-fluid">
                <p-button 
                  class="but2"  
                  severity="danger" 
                  (onClick)="showDialog()"
  
                  label="Stop">
                </p-button>
              </div>
            </div>
            
            <p-dialog header="Part Count Confirmation" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
              <div class="flex align-items-center gap-3 mb-3">
                  <label>Actual Quantity : {{ vmc01Data?.part_count || 0 }}</label>
              </div>
              <div class="flex align-items-center gap-3 mb-3">
                  <label for="accpcount" class="font-semibold w-6rem">Employee Accepted Count : </label>
                  <input pInputText id="accpcount" [(ngModel)]="empAcceptCount" class="flex-auto" autocomplete="off" />
              </div>
              <div class="flex justify-content-end gap-2">
                  <p-button label="Cancel" severity="secondary" (onClick)="visible = false" />
                  <p-button label="Save"  (click)="stopAndUpdateMachineMode5('VMC-01', processType, partId, processName, uniqid)" (click)="saveEmpAcceptCount(customid)" (onClick)="visible = false" />
  
              </div>
          </p-dialog>
    </div>    
    <div class="grid" >
        <div class="col-12 md:col-4">
            <div class="card p-fluid" id="box">
                <div class="field">
                    <label>Part Id : {{ partId }} </label>
                </div>
                <div class="field">
                    <label>Part Name : {{ partName }} </label>
                </div>
            </div>    
        </div>
        <div class="col-12 md:col-4">
            <div class="card p-fluid" id="box">
              <div class="field">
                <label>Run Time : {{ formatTime(vmc01Data?.timers?.runtime || 0) }}</label>
              </div>
              <div class="field">
                <label>Idle Time : {{ formatTime(vmc01Data?.timers?.idle || 0) }}</label>
              </div>
            </div>
          </div>    
          <div class="col-12 md:col-4">
            <div class="card p-fluid" id="box">
                <div class="field">
                    <label>Setter Name : {{setterName}}</label>
                </div>
                <div class="field">
                    <label>operator Name : {{operatorName}}</label>

                </div>
            </div> 
        </div> 
    </div>
    <div class="grid">    
        <div class="col-12 md:col-3">
            <div class="card p-fluid" id="box">
              <div class="field">
                <label>Process Name : {{processName}}</label>
            </div>
            </div>    
          </div>
        <div class="col-12 md:col-3">
            <div class="card p-fluid" id="box">
              <div class="field">
                <label>Planned Cycle Time : {{cycle }} mins</label>
                <label>Actual Cycle Time : {{ formatTime(vmc01Data?.cycle_time || 0) }}</label>
              </div>
            </div>    
          </div>
        <div class="col-12 md:col-3">
            <div class="card p-fluid" id="box">
                <div class="field">
                    <label>Assigned Quantity : {{ planquantity }}</label>
                </div>
            </div>    
        </div>
        <div class="col-12 md:col-3" >
            <div class="card p-fluid" id="box">
                <div class="field">
                    <label>Actual Quantity : {{ vmc01Data?.part_count || 0 }}</label>
                </div>
            </div>    
        </div>
         </div>
</div>    

<style>
    label{
        text-transform: uppercase;
        font-weight: 600;
    }
    #box{
        background-color: rgb(229, 244, 255);
    }
    .refresh-button {
                float: right;
            }
</style>
