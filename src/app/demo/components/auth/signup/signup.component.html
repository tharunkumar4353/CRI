


  <div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <img src="assets\layout\images\cri.png" alt="Sakai logo" class="mb-5 w-15rem flex-shrink-0">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Welcome!</div>
                    <span class="text-600 font-medium">Sign Up to continue</span>
                </div>

                <div>
                    <label for="emp1" class="block text-900 text-xl font-medium mb-2">Employee Id</label>
                    <input id="emp1" type="text" [(ngModel)]="emp"  pInputText class="w-full md:w-30rem mb-5" style="padding:1rem">

                    <label for="name1" class="block text-900 text-xl font-medium mb-2">Name</label>
                    <input id="name1" type="text" [(ngModel)]="name"  pInputText class="w-full md:w-30rem mb-5" style="padding:1rem">

                    <label for="password1" class="block text-900 font-medium text-xl mb-2">Password</label>
                    <p-password id="password1" [(ngModel)]="password"  [toggleMask]="true" styleClass="mb-5" inputStyleClass="w-full p-3 md:w-30rem"></p-password>
                   
                    <label for="password2" class="block text-900 font-medium text-xl mb-2">Confirm Password</label>
                    <p-password [(ngModel)]="conpass" [feedback]="false" inputStyleClass="w-full p-3 md:w-30rem"/>
                   <br><br>
                    <div class="flex align-items-center justify-content-between mb-5 gap-5">
                    <button pButton pRipple label="Sign Up" class="w-full p-3 text-xl" (click)="showDialog()"></button>
                </div>
                </div>
                <br>
            </div>
        </div>
    </div>
</div>
    <p-dialog header="Add Employee Profile" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
        <div class="flex align-items-center gap-3 mb-3">
            <label for="password" class="font-semibold w-6rem">Admin Password</label>
            <input pInputText id="password"  [(ngModel)]="adpass" class="flex-auto" autocomplete="off" />
        </div>

        <div class="flex justify-content-end gap-2">
            <p-button label="Cancel" severity="secondary" (click)="visible = false" />
            <p-button label="Submit" (click)=" signUp()" (click)="visible = false" />
        </div>
    </p-dialog>
